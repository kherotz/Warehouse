<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warehouse Scan & Storage</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e2e5ea;--ac:#e8590c;--acx:#fff;--ok:#2b8a3e;--bad:#c92a2a;--chip:#fff4e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101318;--card:#1a1f27;--tx:#eef0f3;--mut:#9aa3b2;--bd:#2c333d;--ac:#ff922b;--acx:#1a1205;--ok:#69db7c;--bad:#ff8787;--chip:#3a2a14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101318;--card:#1a1f27;--tx:#eef0f3;--mut:#9aa3b2;--bd:#2c333d;--ac:#ff922b;--acx:#1a1205;--ok:#69db7c;--bad:#ff8787;--chip:#3a2a14;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:72px}
header{padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0;letter-spacing:-.01em}h2{font-size:15px;margin:18px 0 8px}
main{padding:0 16px 16px;max-width:760px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);font:600 11px system-ui;padding:6px 0;cursor:pointer;border-radius:8px}
nav button b{display:block;font-size:18px;font-weight:400}
nav button.on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;min-width:0}
input:focus{outline:2px solid var(--ac);border-color:transparent}
.grow{flex:1}
button.btn{font:600 14px system-ui;border:0;border-radius:8px;padding:10px 14px;background:var(--ac);color:var(--acx);cursor:pointer}
button.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.btn.d{background:none;color:var(--bad);border:1px solid var(--bd);padding:6px 10px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.modes button{padding:10px 2px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 13px system-ui;cursor:pointer}
.modes button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
#scan{width:100%;font-size:18px;padding:14px;border:2px solid var(--ac)}
.chips{display:grid;gap:8px;margin:12px 0}
.chip{border:1px dashed var(--bd);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px}
.chip.set{border-style:solid;border-color:var(--ac);background:var(--chip)}
.chip small{color:var(--mut);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0 12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.stat b{font-size:24px;display:block}.stat span{color:var(--mut);font-size:12px}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.mut{color:var(--mut);font-size:13px}.tag{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 7px;font-size:12px;margin:2px 4px 0 0}
.low{color:var(--bad);font-weight:700}.ok{color:var(--ok)}
.in{color:var(--ok)}.out{color:var(--bad)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.show{opacity:1}
video{width:100%;border-radius:10px;background:#000;max-height:260px}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.label{background:#fff;color:#000;border:1px solid #bbb;border-radius:6px;padding:8px;text-align:center;font-size:12px}
.label svg{width:100%;height:44px;fill:#000;display:block;margin:4px 0}.label b{font-size:13px}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;padding:0}.label{break-inside:avoid}}
</style></head><body>
<header><h1>📦 Warehouse Scan & Storage</h1><span class="mut" id="clock"></span></header>
<main id="app"></main>
<nav id="nav"></nav><div id="toast"></div>
<script>
let view='scan',mode='receive',ctx={},unknown=null,q='';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MODES={receive:['Receive','Put stock into a bin'],pick:['Pick','Take stock out'],move:['Move','Bin to bin'],count:['Count','Set counted qty']};
const TABS=[['scan','📷','Scan'],['stock','📊','Stock'],['items','🏷️','Items'],['bins','🗄️','Bins'],['log','🕘','History'],['labels','🖨️','Labels']];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}
function beep(f){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=f;o.connect(a.destination);o.start();setTimeout(()=>o.stop(),110)}catch(e){}}
function nav(){$('#nav').innerHTML=TABS.map(t=>`<button class="${view==t[0]?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('')}
function go(v){view=v;render()}
/* ---------- Code 39 barcode ---------- */
const P={0:'nnnwwnwnn',1:'wnnwnnnnw',2:'nnwwnnnnw',3:'wnwwnnnnn',4:'nnnwwnnnw',5:'wnnwwnnnn',6:'nnwwwnnnn',7:'nnnwnnwnw',8:'wnnwnnwnn',9:'nnwwnnwnn',A:'wnnnnwnnw',B:'nnwnnwnnw',C:'wnwnnwnnn',D:'nnnnwwnnw',E:'wnnnwwnnn',F:'nnwnwwnnn',G:'nnnnnwwnw',H:'wnnnnwwnn',I:'nnwnnwwnn',J:'nnnnwwwnn',K:'wnnnnnnww',L:'nnwnnnnww',M:'wnwnnnnwn',N:'nnnnwnnww',O:'wnnnwnnwn',P:'nnwnwnnwn',Q:'nnnnnnwww',R:'wnnnnnwwn',S:'nnwnnnwwn',T:'nnnnwnwwn',U:'wwnnnnnnw',V:'nwwnnnnnw',W:'wwwnnnnnn',X:'nwnnwnnnw',Y:'wwnnwnnnn',Z:'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn','*':'nwnnwnwnn'};
function c39(t){let x=0,r='';for(const ch of '*'+t.toUpperCase()+'*'){const p=P[ch];if(!p)continue;for(let i=0;i<9;i++){const w=p[i]=='w'?3:1;if(i%2==0)r+=`<rect x="${x}" width="${w}" height="40"/>`;x+=w}x+=1}return `<svg viewBox="0 0 ${x} 40" preserveAspectRatio="none">${r}</svg>`}
/* ---------- Scan workflow ---------- */
function handle(raw){const c=raw.trim().toUpperCase();if(!c)return;
 const it=S.items.find(i=>i.bc.toUpperCase()==c||i.sku.toUpperCase()==c),lc=S.locs.find(l=>l.code==c);
 if(it){ctx.item=it;unknown=null;beep(880)}
 else if(lc){if(mode=='move'&&ctx.loc&&!ctx.loc2)ctx.loc2=lc;else if(mode=='move'&&ctx.loc&&ctx.loc2){ctx.loc=lc;ctx.loc2=null}else ctx.loc=lc;beep(660)}
 else{unknown=c;beep(200);toast('Unknown code: '+c)}
 render()}
/* camera */
let stream=null,camOn=false;
async function cam(){if(camOn){camOn=false;stream&&stream.getTracks().forEach(t=>t.stop());return render()}
 try{if(!('BarcodeDetector' in window))throw 0;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});camOn=true;render();
  const v=$('#vid');v.srcObject=stream;await v.play();const d=new BarcodeDetector();let last='';
  (async function loop(){if(!camOn)return;try{const r=await d.detect(v);if(r[0]&&r[0].rawValue!=last){last=r[0].rawValue;handle(last)}}catch(e){}setTimeout(loop,300)})()
 }catch(e){camOn=false;toast('Camera scanning isn’t available here. Use a handheld scanner or type the code.')}}
function vScan(){const[ , hint]=MODES[mode],{item,loc,loc2}=ctx;
 const chip=(l,v,s)=>`<div class="chip ${v?'set':''}"><div><small>${l}</small>${v?esc(s):'Waiting for scan…'}</div></div>`;
 const lbl=mode=='move'?['From bin','To bin']:[mode=='pick'?'Pick from bin':'Bin',''];
 const here=item&&(mode=='pick'||mode=='move')?where(item.sku):[];
 return `<div class="modes">${Object.keys(MODES).map(m=>`<button class="${m==mode?'on':''}" onclick="mode='${m}';ctx={};unknown=null;render()">${MODES[m][0]}</button>`).join('')}</div>
 <div class="card"><div class="mut" style="margin-bottom:8px">${hint}. Scan item and bin barcodes in any order.</div>
 <div class="row"><input id="scan" class="grow" placeholder="Scan or type code, press Enter" autocomplete="off" autocapitalize="characters" onkeydown="if(event.key=='Enter'){handle(this.value);this.value=''}"><button class="btn g" onclick="cam()">${camOn?'Stop':'📷'}</button></div>
 ${camOn?'<video id="vid" playsinline muted style="margin-top:10px"></video>':''}
 ${unknown?`<div class="row" style="margin-top:10px"><span class="mut">New code <b>${esc(unknown)}</b></span><input id="nn" class="grow" placeholder="Item name"><button class="btn" onclick="saveUnknown()">Add item</button></div>`:''}
 <div class="chips">${chip('Item',item,item?item.name+' · '+item.sku+' · total '+total(item.sku):'')}${chip(lbl[0],loc,loc?loc.code+(item?' · here: '+qty(item.sku,loc.code):''):'')}${mode=='move'?chip(lbl[1],loc2,loc2&&loc2.code):''}</div>
 ${here.length?`<div class="mut" style="margin-bottom:10px">Stored in: ${here.map(h=>`<span class="tag">${esc(h[0])} × ${h[1]}</span>`).join('')}</div>`:''}
 <div class="row"><input id="qty" type="number" inputmode="numeric" min="0" value="1" style="width:100px" onkeydown="if(event.key=='Enter')confirmOp()"><button class="btn grow" onclick="confirmOp()">Confirm ${MODES[mode][0]}</button><button class="btn g" onclick="ctx={};unknown=null;render()">Clear</button></div></div>
 <div class="mut">Tip: tap Labels to print barcodes for your items and bins, then scan them here.</div>`}
function vStock(){const its=S.items.filter(i=>(i.sku+i.name).toLowerCase().includes(q.toLowerCase()));
 const units=S.items.reduce((a,i)=>a+total(i.sku),0),used=new Set(Object.keys(S.stock).map(k=>k.split('|')[1])).size,low=S.items.filter(i=>total(i.sku)<i.min).length;
 return `<div class="stats"><div class="stat"><b>${S.items.length}</b><span>Item types</span></div><div class="stat"><b>${units}</b><span>Units in stock</span></div><div class="stat"><b>${used}/${S.locs.length}</b><span>Bins in use</span></div><div class="stat"><b class="${low?'low':''}">${low}</b><span>Below minimum</span></div></div>
 <input id="sq" style="width:100%;margin-bottom:10px" placeholder="Search items…" value="${esc(q)}" oninput="q=this.value;render(true)">
 <div class="card">${its.map(i=>{const t=total(i.sku);return `<div class="li"><div><b>${esc(i.name)}</b><div class="mut">${esc(i.sku)}</div>${where(i.sku).map(w=>`<span class="tag">${esc(w[0])} × ${w[1]}</span>`).join('')||'<span class="mut">No stock</span>'}</div><div style="text-align:right"><b class="${t<i.min?'low':''}" style="font-size:20px">${t}</b><div class="mut">min ${i.min}</div></div></div>`}).join('')||'<div class="mut">No items</div>'}</div>`}
function vLabels(){return `<div class="row noprint" style="margin-bottom:10px"><button class="btn" onclick="window.print()">Print labels</button><span class="mut">Code 39 barcodes</span></div>
 <h2>Bins</h2><div class="labels">${S.locs.map(l=>`<div class="label"><b>${esc(l.code)}</b>${c39(l.code)}BIN</div>`).join('')}</div>
 <h2>Items</h2><div class="labels">${S.items.map(i=>`<div class="label"><b>${esc(i.name)}</b>${c39(i.bc)}${esc(i.sku)}</div>`).join('')}</div>`}
setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})},1000);
/* ===== enterprise layer: shared DB, roles, sites, audit ledger ===== */
let S={items:[],bins:[],moves:[],stock:{},locs:[],log:[],sites:[]},DB=null,ME=null,US=null,ADMIN=true,LOCAL=true,READY=false,SITE='Main',busy=false;
const LK='wh_v2',cl=s=>String(s).replace(/[^\w.-]/g,'_');
const bump=(sku,loc,n,abs)=>{const k=sku+'|'+loc,v=abs?n:(S.stock[k]||0)+n;if(v<=0)delete S.stock[k];else S.stock[k]=v};
const qty=(sku,loc)=>S.stock[sku+'|'+loc]||0;
const total=sku=>Object.keys(S.stock).filter(k=>k.startsWith(sku+'|')).reduce((a,k)=>a+S.stock[k],0);
const where=sku=>Object.keys(S.stock).filter(k=>k.startsWith(sku+'|')).map(k=>[k.split('|')[1],S.stock[k]]);
function recompute(){S.sites=[...new Set(S.bins.map(b=>b.site))].sort();if(S.sites.length&&!S.sites.includes(SITE))SITE=S.sites[0];
 S.stock={};const L=S.moves.filter(m=>m.site==SITE).sort((a,b)=>a.t-b.t);
 for(const m of L){if(m.type=='receive')bump(m.sku,m.to,m.qty);else if(m.type=='pick')bump(m.sku,m.from,-m.qty);else if(m.type=='move'){bump(m.sku,m.from,-m.qty);bump(m.sku,m.to,m.qty)}else if(m.type=='count')bump(m.sku,m.to,m.qty,1)}
 S.log=L.reverse();S.locs=S.bins.filter(b=>b.site==SITE).sort((a,b)=>a.code<b.code?-1:1);S.items.sort((a,b)=>a.name<b.name?-1:1)}
function refresh(){READY=true;recompute();if(!camOn)render(true)}
const localSave=()=>{try{localStorage.setItem(LK,JSON.stringify({items:S.items,bins:S.bins,moves:S.moves}))}catch(e){}};
function seedLocal(){const t=Date.now(),I=[['SKU-1001','Widget A',20],['SKU-1002','USB-C Cable 1m',50],['SKU-1003','Shipping Box 30cm',30],['SKU-1004','Packing Tape',10]];
 S.items=I.map(([s,n,m])=>({id:s,sku:s,bc:s,name:n,min:m}));S.bins=['DOCK','A-01-01','A-01-02','A-02-01','B-01-01','B-01-02'].map(c=>({id:'Main_'+c,code:c,site:'Main'}));
 S.moves=[['SKU-1001','A-01-01',40],['SKU-1002','A-01-02',120],['SKU-1003','B-01-01',18],['SKU-1004','B-01-02',25]].map(([s,l,q],i)=>({id:'seed'+i,t:t-1e5+i,type:'receive',sku:s,name:S.items.find(x=>x.sku==s).name,to:l,qty:q,site:'Main',by:'local'}))}
const denied=e=>e&&e.code=='not_granted'?'Your role doesn’t allow that':'Save failed: '+((e&&(e.message||e.code))||'error');
async function put(col,id,d){if(DB){try{await DB.collection(col).doc(id).set(d);return true}catch(e){toast(denied(e));return false}}
 S[col]=S[col].filter(x=>x.id!=id).concat([{...d,id}]);localSave();refresh();return true}
async function del(col,id){if(DB){try{await DB.collection(col).doc(id).delete();return true}catch(e){toast(denied(e));return false}}
 S[col]=S[col].filter(x=>x.id!=id);localSave();refresh();return true}
async function confirmOp(){const n=parseInt($('#qty').value,10),{item,loc,loc2}=ctx;
 if(!item)return toast('Scan an item first');
 if(!loc)return toast(mode=='receive'||mode=='count'?'Scan a bin':'Scan the source bin');
 if(mode=='move'&&!loc2)return toast('Scan the destination bin');
 if(mode!='count'&&!(n>0))return toast('Enter a quantity');
 if(mode=='count'&&!(n>=0))return toast('Enter counted qty');
 const e={t:Date.now(),type:mode,sku:item.sku,name:item.name,qty:n,site:SITE,by:(ME&&ME.id)||'local'};
 if(mode=='receive')e.to=loc.code;
 if(mode=='pick'||mode=='move'){if(qty(item.sku,loc.code)<n)return toast('Only '+qty(item.sku,loc.code)+' in '+loc.code);e.from=loc.code}
 if(mode=='move'){if(loc.code==loc2.code)return toast('Same bin');e.to=loc2.code}
 if(mode=='count'){e.to=loc.code;e.diff=n-qty(item.sku,loc.code)}
 if(busy)return;busy=true;const ok=await put('moves','m'+e.t+Math.random().toString(36).slice(2,6),e);busy=false;
 if(ok){ctx={};beep(1100);toast('✓ '+MODES[mode][0]+' recorded');render()}}
async function saveUnknown(){if(!ADMIN)return toast('Ask an admin to add this item');const nm=$('#nn').value.trim()||unknown,it={sku:unknown,name:nm,bc:unknown,min:0};
 if(await put('items',cl(unknown),it)){ctx.item={...it,id:cl(unknown)};unknown=null;render()}}
function setSite(v){SITE=v;try{localStorage.setItem('wh_site',v)}catch(e){}ctx={};refresh()}
function bar(){const ss=S.sites.length?S.sites:[SITE];return `<div class="row" style="margin-bottom:12px"><select onchange="setSite(this.value)">${ss.map(s=>`<option ${s==SITE?'selected':''}>${esc(s)}</option>`).join('')}</select><span class="tag">${ADMIN?'Admin':'Operator'}</span><span class="tag">${LOCAL?'Local demo':'● Live · shared'}</span></div>`}
function vItems(){return (ADMIN?`<div class="card"><b>Add item</b><div class="row" style="margin-top:8px"><input id="a1" placeholder="SKU / barcode" class="grow"><input id="a2" placeholder="Name" class="grow"><input id="a3" type="number" placeholder="Min" style="width:80px"><button class="btn" onclick="addItem()">Add</button></div>
 <div class="mut" style="margin:12px 0 6px">Bulk import, one per line: sku,name,min</div><textarea id="bi" rows="3" style="width:100%"></textarea><button class="btn g" style="margin-top:6px" onclick="bulkItems()">Import</button></div>`:'<div class="mut" style="margin-bottom:10px">Read-only: an admin manages the item catalogue.</div>')
 +`<div class="card">${S.items.map(i=>`<div class="li"><div><b>${esc(i.name)}</b><div class="mut">${esc(i.sku)} · min ${i.min}</div></div>${ADMIN?`<button class="btn d" onclick="delItem('${esc(i.id)}')">Delete</button>`:''}</div>`).join('')||'<div class="mut">No items</div>'}</div>`}
async function addItem(){const s=$('#a1').value.trim().toUpperCase(),n=$('#a2').value.trim();if(!s||!n)return toast('SKU and name required');if(S.items.some(i=>i.sku==s))return toast('SKU exists');await put('items',cl(s),{sku:s,name:n,bc:s,min:parseInt($('#a3').value)||0});render()}
async function bulkItems(){let c=0;for(const l of $('#bi').value.split('\n')){const[s,n,m]=l.split(',').map(x=>x.trim());if(!s||!n)continue;const u=s.toUpperCase();await put('items',cl(u),{sku:u,name:n,bc:u,min:parseInt(m)||0});c++}toast(c+' items imported');render()}
async function delItem(id){const i=S.items.find(x=>x.id==id);if(S.moves.some(m=>m.sku==i.sku))return toast('Has history, so it can’t be deleted (audit trail)');await del('items',id);render()}
function vBins(){return (ADMIN?`<div class="card"><b>Add bin</b><div class="row" style="margin-top:8px"><input id="b1" placeholder="Code e.g. C-01-01" class="grow"><input id="b2" value="${esc(SITE)}" placeholder="Site" style="width:120px"><button class="btn" onclick="addBin()">Add</button></div>
 <div class="mut" style="margin:12px 0 6px">Bulk import for the site above, one code per line. A new site name creates a new warehouse.</div><textarea id="bb" rows="3" style="width:100%"></textarea><button class="btn g" style="margin-top:6px" onclick="bulkBins()">Import</button></div>`:'<div class="mut" style="margin-bottom:10px">Read-only: an admin manages bins.</div>')
 +`<div class="card">${S.locs.map(l=>{const c=Object.keys(S.stock).filter(k=>k.endsWith('|'+l.code));return `<div class="li"><div><b>${esc(l.code)}</b><div class="mut">${c.length?c.map(k=>esc(k.split('|')[0])+' × '+S.stock[k]).join(', '):'Empty'}</div></div>${ADMIN?`<button class="btn d" onclick="delBin('${esc(l.id)}')">Delete</button>`:''}</div>`}).join('')||'<div class="mut">No bins at this site</div>'}</div>`}
async function addBins(list){const s=($('#b2')?$('#b2').value.trim():'')||SITE;let c=0;for(const x of list){const u=x.trim().toUpperCase();if(!u||S.bins.some(b=>b.site==s&&b.code==u))continue;await put('bins',cl(s+'_'+u),{code:u,site:s});c++}toast(c+' bins added');if(s!=SITE)setSite(s);else render()}
const addBin=()=>addBins([$('#b1').value]),bulkBins=()=>addBins($('#bb').value.split('\n'));
async function delBin(id){const b=S.bins.find(x=>x.id==id);if(S.moves.some(m=>m.site==b.site&&(m.to==b.code||m.from==b.code)))return toast('Bin has history and can’t be deleted');await del('bins',id);render()}
function vLog(){return `<div class="row" style="margin-bottom:10px"><button class="btn g" onclick="exportCsv('stock')">Export stock CSV</button><button class="btn g" onclick="exportCsv('history')">Export history CSV</button></div>
 <div class="card">${S.log.slice(0,200).map(e=>`<div class="li"><div><b class="${e.type=='pick'?'out':e.type=='receive'?'in':''}">${MODES[e.type][0]}</b> ${esc(e.name)}<div class="mut">${esc(e.sku)} · ${e.from?esc(e.from)+' → ':''}${e.to?esc(e.to):''} · ${new Date(e.t).toLocaleString()} · <span data-u="${esc(e.by||'')}"></span></div></div><b>${e.type=='count'?'='+e.qty+(e.diff?' ('+(e.diff>0?'+':'')+e.diff+')':''):e.qty}</b></div>`).join('')||'<div class="mut">No activity yet</div>'}</div>
 ${LOCAL?'<button class="btn d" onclick="seedLocal();localSave();refresh()">Reset demo data</button>':'<div class="mut">Every action is recorded with the user and time. Stock is calculated from this ledger.</div>'}`}
async function names(ids){const o={};ids=ids.filter(x=>x&&x!='local');try{if(US&&ids.length){const p=await US.profiles(ids);for(const i of ids)o[i]=(p[i]&&p[i].name)||'Team member'}}catch(e){}return o}
async function fillNames(){const els=[...document.querySelectorAll('[data-u]')];if(!els.length)return;const m=await names([...new Set(els.map(e=>e.dataset.u))]);els.forEach(e=>e.textContent=e.dataset.u=='local'?'Local user':(m[e.dataset.u]||''))}
const csv=r=>r.map(x=>x.map(v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n');
async function exportCsv(kind){let dl=null;try{dl=window.claude&&await claude.use('downloads')}catch(e){}if(!dl)return toast('Downloads aren’t available here');
 let rows;if(kind=='stock')rows=[['Site','SKU','Item','Bin','Qty'],...Object.keys(S.stock).sort().map(k=>{const[s,l]=k.split('|'),i=S.items.find(x=>x.sku==s)||{};return[SITE,s,i.name||'',l,S.stock[k]]})];
 else{const n=await names([...new Set(S.log.map(m=>m.by))]);rows=[['Time','Site','Type','SKU','Item','From','To','Qty','User'],...S.log.map(m=>[new Date(m.t).toISOString(),m.site,m.type,m.sku,m.name,m.from||'',m.to||'',m.qty,n[m.by]||m.by||''])]}
 try{await dl.save({filename:kind+'-'+SITE+'.csv',data:csv(rows)})}catch(e){if(!e||e.code!='declined')toast('Export failed')}}
function render(keep){nav();if(!READY){$('#app').innerHTML='<div class="mut" style="padding:24px 0">Connecting…</div>';return}
 const V={scan:vScan,stock:vStock,items:vItems,bins:vBins,log:vLog,labels:vLabels},a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart,qv=($('#qty')||{}).value,sv=($('#scan')||{}).value;
 $('#app').innerHTML=bar()+V[view]();
 if(qv&&$('#qty'))$('#qty').value=qv;if(sv&&$('#scan'))$('#scan').value=sv;
 if(keep&&id&&$('#'+id)){const e=$('#'+id);e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}
 else if(view=='scan'&&!unknown&&!camOn){const s=$('#scan');s&&s.focus({preventScroll:true})}
 fillNames()}
async function boot(){try{const u=window.claude&&await claude.use('user');if(u){US=u;ME=await u.me();ADMIN=await u.canEdit()}}catch(e){}
 let db=null;try{db=window.claude&&await claude.use('db')}catch(e){}
 try{SITE=localStorage.getItem('wh_site')||SITE}catch(e){}
 if(db){DB=db;LOCAL=false;['items','bins','moves'].forEach(c=>DB.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({...d.data(),id:d.id}));refresh()},e=>toast('Sync error: '+((e&&e.code)||''))))}
 else{try{const j=JSON.parse(localStorage.getItem(LK));if(j&&j.items)Object.assign(S,j);else seedLocal()}catch(e){seedLocal()}}
 refresh()}
render();boot();
</script></body></html>
